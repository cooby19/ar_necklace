name: Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master
      - main
      - staging
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target.
        type: choice
        options:
          - preview
          - staging
          - production
        default: staging
      preview_branch:
        description: Preview branch alias used for manual preview deploys.
        type: string
        default: manual-preview
      ref:
        description: Optional commit SHA, tag, or branch to rebuild and deploy.
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      branch_alias: ${{ steps.resolve.outputs.branch_alias }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - name: Resolve target
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
          INPUT_PREVIEW_BRANCH: ${{ github.event.inputs.preview_branch }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          target="${INPUT_TARGET:-staging}"
          branch_alias="${INPUT_PREVIEW_BRANCH:-manual-preview}"
          ref="${INPUT_REF:-$GITHUB_SHA_VALUE}"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            target="preview"
            branch_alias="pr-${PR_NUMBER}"
            ref="$GITHUB_SHA_VALUE"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "staging" ]; then
            target="staging"
            branch_alias="staging"
            ref="$GITHUB_SHA_VALUE"
          elif [ "$EVENT_NAME" = "push" ] && { [ "$REF_NAME" = "main" ] || [ "$REF_NAME" = "master" ]; }; then
            target="production"
            branch_alias="$REF_NAME"
            ref="$GITHUB_SHA_VALUE"
          elif [ "$EVENT_NAME" = "release" ]; then
            target="production"
            branch_alias="release-${RELEASE_TAG}"
            ref="$GITHUB_SHA_VALUE"
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "branch_alias=$branch_alias" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  preflight:
    name: Deployment secret preflight
    runs-on: ubuntu-latest
    outputs:
      cloudflare_enabled: ${{ steps.check.outputs.cloudflare_enabled }}
      staging_smoke_url_configured: ${{ steps.check.outputs.staging_smoke_url_configured }}
      production_smoke_url_configured: ${{ steps.check.outputs.production_smoke_url_configured }}
    steps:
      - name: Check optional deployment secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          STAGING_URL: ${{ secrets.STAGING_URL }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "cloudflare_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deployment secrets are not configured; deploy jobs will be skipped."
          fi

          if [ -n "$STAGING_URL" ]; then
            echo "staging_smoke_url_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "staging_smoke_url_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$PRODUCTION_URL" ]; then
            echo "production_smoke_url_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "production_smoke_url_configured=false" >> "$GITHUB_OUTPUT"
          fi

  build-artifact:
    name: Build deploy artifact
    runs-on: ubuntu-latest
    needs: resolve
    outputs:
      artifact_sha: ${{ steps.git.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Resolve checked out commit
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture build time
        id: release_meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          BUILD_TIME: ${{ steps.release_meta.outputs.build_time }}
          DEPLOY_ENVIRONMENT: ${{ needs.resolve.outputs.target }}
          GITHUB_SHA: ${{ steps.git.outputs.sha }}
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Synthetic smoke on deploy artifact
        run: npm run smoke

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-necklace-dist-${{ needs.resolve.outputs.target }}-${{ steps.git.outputs.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  deploy-preview:
    name: Deploy PR preview
    runs-on: ubuntu-latest
    needs: [resolve, preflight, build-artifact]
    if: needs.resolve.outputs.target == 'preview' && needs.preflight.outputs.cloudflare_enabled == 'true'
    environment:
      name: pr-preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: ar-necklace-dist-${{ needs.resolve.outputs.target }}-${{ needs.build-artifact.outputs.artifact_sha }}
          path: dist

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          DEPLOY_BRANCH: ${{ needs.resolve.outputs.branch_alias }}
        run: |
          set +e
          output="$(npx --yes wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$DEPLOY_BRANCH" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke preview deployment
        if: steps.deploy.outputs.url != ''
        env:
          SMOKE_BASE_URL: ${{ steps.deploy.outputs.url }}
          EXPECTED_COMMIT_SHA: ${{ needs.build-artifact.outputs.artifact_sha }}
        run: npm run smoke

  deploy-staging:
    name: Deploy staging and smoke
    runs-on: ubuntu-latest
    needs: [resolve, preflight, build-artifact]
    if: (needs.resolve.outputs.target == 'staging' || needs.resolve.outputs.target == 'production') && needs.preflight.outputs.cloudflare_enabled == 'true'
    environment:
      name: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: ar-necklace-dist-${{ needs.resolve.outputs.target }}-${{ needs.build-artifact.outputs.artifact_sha }}
          path: dist

      - name: Deploy staging to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          set +e
          output="$(npx --yes wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch staging 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke staging deployment
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          EXPECTED_COMMIT_SHA: ${{ needs.build-artifact.outputs.artifact_sha }}
        run: |
          base_url="${STAGING_URL:-https://staging.${CLOUDFLARE_PAGES_PROJECT}.pages.dev}"
          SMOKE_BASE_URL="$base_url" npm run smoke

  deploy-production:
    name: Deploy production and smoke
    runs-on: ubuntu-latest
    needs: [resolve, preflight, build-artifact, deploy-staging]
    if: needs.resolve.outputs.target == 'production' && needs.preflight.outputs.cloudflare_enabled == 'true' && needs.deploy-staging.result == 'success'
    environment:
      name: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Download deploy artifact
        uses: actions/download-artifact@v4
        with:
          name: ar-necklace-dist-${{ needs.resolve.outputs.target }}-${{ needs.build-artifact.outputs.artifact_sha }}
          path: dist

      - name: Resolve Cloudflare production branch
        id: cf_project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          response="$(curl --fail --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${CLOUDFLARE_PAGES_PROJECT}" \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json")"
          production_branch="$(RESPONSE="$response" node -e "const data = JSON.parse(process.env.RESPONSE); const branch = data.result?.production_branch; if (!branch) throw new Error('Cloudflare Pages production_branch is missing.'); process.stdout.write(branch);")"
          echo "production_branch=$production_branch" >> "$GITHUB_OUTPUT"

      - name: Deploy production to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          PRODUCTION_BRANCH: ${{ steps.cf_project.outputs.production_branch }}
        run: |
          set +e
          output="$(npx --yes wrangler@latest pages deploy dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$PRODUCTION_BRANCH" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          url="$(printf '%s\n' "$output" | grep -Eo 'https://[^ ]+\.pages\.dev' | tail -1 || true)"
          if [ -n "$url" ]; then
            echo "url=$url" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke production deployment
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          EXPECTED_COMMIT_SHA: ${{ needs.build-artifact.outputs.artifact_sha }}
        run: |
          base_url="${PRODUCTION_URL:-https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev}"
          SMOKE_BASE_URL="$base_url" npm run smoke
