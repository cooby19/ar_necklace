name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: |
          mkdir -p audit-reports
          set +e
          npm audit --omit=dev --json > audit-reports/npm-audit-omit-dev.json
          audit_exit=$?
          set -e
          if [ "$audit_exit" -ne 0 ]; then
            echo "::warning::npm audit --omit=dev reported production dependency advisories. See the npm-audit-omit-dev artifact."
            npm audit --omit=dev || true
          fi

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-omit-dev
          path: audit-reports/npm-audit-omit-dev.json
          if-no-files-found: ignore

  a11y:
    name: Accessibility
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility tests
        run: npm run test:a11y

      - name: Upload accessibility artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-artifacts
          path: |
            playwright-report/a11y/
            test-results/a11y/
          if-no-files-found: ignore

  visual:
    name: Visual regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual tests
        run: npm run test:visual

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture build time
        id: release_meta
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          BUILD_TIME: ${{ steps.release_meta.outputs.build_time }}
          DEPLOY_ENVIRONMENT: ci
        run: npm run build

      - name: Bundle budget
        run: npm run budget

      - name: Install browser Chromium
        run: npx playwright install --with-deps chromium

      - name: Synthetic smoke
        run: npm run smoke

      - name: Lighthouse
        run: npm run lighthouse

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: lighthouse-report/
          if-no-files-found: ignore

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-necklace-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
